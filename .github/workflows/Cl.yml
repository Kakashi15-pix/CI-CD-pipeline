name: ML pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest # Operating system for the job
    steps:
      - name: Download Project code 
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: ML model Training
        run: python train.py
      - name: ML model Testing
        run: python test.py
      - name: Deployment
        if: success() && github.ref == 'refs/heads/main'
        env: 
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_SECRET}} 
        run: curl --fail --silent --show-error "$DEPLOY_HOOK_URL"  